<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chai aur Code</title>
  </head>
  <body style="background-color: #212121; color: #fff">
    <ul class="language">
      <li>JavaScript</li>
    </ul>
  </body>
  <script>
    // 1. Unoptimized approach using innerHTML (triggers heavy browser parsing)
    function addLang(LangName) {
      const li = document.createElement("li");
      li.innerHTML = `${LangName}`;
      document.querySelector(".language").appendChild(li);
    }
    
    // 2. Testing the unoptimized function to add items
    addLang("Python");
    addLang("C++");
    
    // 3. Optimized approach using textNode (faster, safer, direct DOM insertion)
    function addOptiLang(langName) {
      const li = document.createElement("li");
      li.appendChild(document.createTextNode(langName));
      document.querySelector(".language").appendChild(li);
    }
    
    // 4. Testing the optimized function to add an item
    addOptiLang("Java");

    // 5. Targeting the second item ("Python") in the current list
    const secondLang = document.querySelector("li:nth-child(2)");
    
    // 6. Creating a fresh element node to prevent moving existing items
    const newli = document.createElement("li");
    
    // 7. Adding text content safely to the brand new node
    newli.textContent = "C#";
    
    // 8. Swapping out the target element with the newly created node
    secondLang.replaceWith(newli);

    // 9. Targeting the very first item ("JavaScript") in the list
    const firstLang = document.querySelector("li:first-child");
    
    // 10. Replacing the entire element structure using raw HTML text
    firstLang.outerHTML = "<li>TypeScript</li>";

    // 11. Targeting the very last item ("Java") in the list
    const lastLang = document.querySelector("li:last-child");
    
    // 12. Removing the targeted node completely from the DOM tree
    lastLang.remove();
  </script>
</html>
